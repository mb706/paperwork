[package]
name = "genabi"
description = "gen.wasm: the worldgen workers' ABI over `worldgen` (10 §15.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
schema.workspace = true
worldgen.workspace = true

[features]
# On by default with simabi's `full-abi` since the Shell package's loaders landed (C3-r1).
default = ["full-abi"]
simcheck = ["worldgen/simcheck", "schema/simcheck"]
# Exports §15.9's whole table (gen_abi_version = schema::GEN_ABI_VERSION, the host imports). Without it the
# module is the M0 scaffold (ABI 0, no imports).
full-abi = []

[lints]
workspace = true
