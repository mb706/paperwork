[package]
name = "genabi"
description = "gen.wasm: the worldgen workers' ABI over `worldgen` (10 §15.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
schema.workspace = true
worldgen.workspace = true

[features]
simcheck = ["worldgen/simcheck", "schema/simcheck"]
# Exports §15.9's whole table (gen_abi_version = schema::GEN_ABI_VERSION, the host imports). Off by default with
# simabi's `full-abi` until the Shell package's loaders replace the M0 scaffold; the WebAssembly tests build it.
full-abi = []

[lints]
workspace = true
