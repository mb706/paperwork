[package]
name = "simabi"
description = "sim.wasm: the C ABI of 10 §15.8 over `sim`, and the panic hook. The only crate (with genabi) allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
schema.workspace = true
sim.workspace = true

[features]
simcheck = ["sim/simcheck", "schema/simcheck"]
# Exports §15.8's whole table (sim_abi_version = schema::ABI_VERSION, the host imports). Off by default until
# the Shell package's loader replaces the M0 scaffold (src/simworker/scaffold.ts instantiates with no imports
# and the e2e smoke test expects ABI 0); the WebAssembly tests build with it (C2; pm/reports/C2.md).
full-abi = []

[lints]
workspace = true
