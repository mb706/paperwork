[package]
name = "simabi"
description = "sim.wasm: the C ABI of 10 §15.8 over `sim`, and the panic hook. The only crate (with genabi) allowed `unsafe`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
schema.workspace = true
sim.workspace = true

[features]
# The Shell package's loaders (C3) run the full module: on by default since C3-r1 (pm/reports/C3.md).
default = ["full-abi"]
simcheck = ["sim/simcheck", "schema/simcheck"]
# Exports §15.8's whole table (sim_abi_version = schema::ABI_VERSION, the host imports). Without it the module
# is the M0 scaffold (ABI 0, no imports), which the shell's handshake refuses (C2; pm/reports/C2.md).
full-abi = []

[lints]
workspace = true
