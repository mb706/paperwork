# Names the engine must know (§2.4 step 4): resolved by name when Protos loads, each an Option of its id
# (absent from a build that lacks it); the data stage checks that the ones the capability manifest needs
# exist in the build.
well_known:
  - character: {kind: entity, doc: "the engine's character (§5.1); game/data/engine/prototypes.yaml defines it"}

