# Engine registries (10 §2.4 step 4, §15.1): the closed vocabularies the data names and the engine
# implements. Each registry generates a Rust enum (matched exhaustively, so an entry without an
# implementation does not compile once the sim dispatches on it) and TypeScript lists for the data stage.
#
# The data stage checks, over the whole design data, that every name the data uses is in its registry (so
# the vocabulary is closed), and that the current capability manifest's `registries` lists (the entries
# that milestone implements) name registry entries. Values are explicit and append-only; names are the
# data's spelling. C1b decision: a registry lists the full vocabulary, and the capability manifest says
# which entries a milestone implements (M0: none).

registries:
  - effects:
      doc: "Technology effect types: meta.effects (02, 05), named by technologies' unlocks.effects[].type"
      base: u16
      values:
        - laboratory-speed: 1
        - research-productivity: 2
        - research-per-paper: 3
        - mining-productivity: 4
        - character-mining-speed: 5
        - character-crafting-speed: 6
        - character-inventory-slots: 7
