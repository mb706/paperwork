# Shared scalars, ids, enums, flag sets and small fixed records (10 §15.1, §15.3, §4.2–§4.3).
#
# Every declaration is a list entry `- Name: {…}`; order inside `values`, `bits` and `fields` is the wire
# order. Enum values and flag bits are explicit, append-only and never reused. Field types are the
# scalars `u8 u16 u32 u64 i8 i16 i32 i64 f32 f64 bool`, the names declared in game/schema/, fixed arrays
# `[T; N]`, and in messages and records `str`, `bytes`, `list<T>`, `blob`, `blob_or_bytes` (each with a
# `max`). A field named `reserved…` is always zero: writers write zero and readers refuse anything else.
# game/schema/README.md explains the format; scripts/schema-gen.ts validates it.

# Raised with every change that alters a save section's layout (§15.1 "Versions"); `since` refers to it,
# and every save records it per section (§8.1). M0 is format 1.
schema_version: 1

ids:
  - Serial: {base: u32, none: 0, doc: "An entity's creation serial (§4.3): never reused; every reference across the boundary. 0 = none"}
  - EntityHandle: {base: u32, none: 0, doc: "(generation << 22) | slot (§4.3). Runtime only: saves store the referenced entity's Serial (§4.5), and handles never leave the module. 0 = none (slot 0 of generation 0 is never handed out)"}
  - ItemKey: {base: u16, none: 0xFFFF, doc: "(item id << 3) | quality index 0–4 (§4.3): belts, slots, hands, filters"}
  - ItemId: {base: u16, none: 0xFFFF, doc: "Dense item prototype id (§2.4 step 5)"}
  - FluidId: {base: u16, none: 0xFFFF, doc: "Dense fluid prototype id"}
  - RecipeId: {base: u16, none: 0xFFFF, doc: "Dense recipe prototype id"}
  - EntityId: {base: u16, none: 0xFFFF, doc: "Dense entity prototype id (the `EntityProto` of §4.5)"}
  - TechId: {base: u16, none: 0xFFFF, doc: "Dense technology prototype id"}
  - ResourceId: {base: u16, none: 0xFFFF, doc: "Dense resource prototype id"}
  - TileId: {base: u8, none: 0xFF, doc: "Dense tile prototype id (§4.3: at most 255 tile types)"}
  - WorldObjectId: {base: u16, none: 0xFFFF, doc: "Dense world-object prototype id (world.yaml)"}
  - SignalId: {base: u16, none: 0xFFFF, doc: "Dense virtual-signal id (M2)"}
  - PlayerIndex: {base: u16, none: 0xFFFF, doc: "0–31 for players (11 §6.5); 0xFFFF for the system and for none"}
  - Tick: {base: u32, doc: "A world tick (§4.2)"}
  - Seq: {base: u32, doc: "An action's sequence number within its player's stay in a world (§4.3, §15.3)"}
  - ChunkKey: {base: u32, doc: "(cx + 2^15) × 2^16 + (cy + 2^15) (§4.4); `chunk_key` and `chunk_xy` convert"}
  - SurfaceIndex: {base: u16, doc: "A surface (§4.3): fewer than 256, so the entity table and event headers store it in a u8"}
  - ExprRef: {base: u32, none: 0xFFFFFFFF, doc: "Byte offset of an expression program in prototypes.bin's EXPR section (§15.2)"}
  - IconIndex: {base: u16, none: 0xFFFF, doc: "Index into prototypes.json's `icons` table (§15.2, §15.7)"}
  - SoundId: {base: u16, none: 0xFFFF, doc: "Dense sound id from game/data/engine/sounds.yaml, sorted by name (§15.6)"}
  - MilestoneId: {base: u16, none: 0xFFFF, doc: "Dense id of text.yaml's milestones, assigned by the data stage (§15.6)"}
  - InvRef: {base: u32, none: 0xFFFFFFFF, doc: "A slot-heap block (§4.5): (size class << 24) | block index"}
  - StatKey: {base: u32, doc: "A production-statistics key (§5.20): (StatKind << 24) | id, the id being an ItemKey, FluidId or EntityId; `stat_key` builds it"}
  - StateGen: {base: u32, doc: "The main thread's state generation (§3.4)"}
  - SubId: {base: u32, doc: "A subscription id (§15.5): 1 upwards, never reused within a state generation; 0 is the hover projection"}
  - QueryId: {base: u32, doc: "A query id (§15.5), chosen by the main thread"}

