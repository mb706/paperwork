structs:
  - EntityRef:
      doc: >-
        An entity named by identity (§15.3, D23). Tag 0 none (a and b zero); tag 1 an existing entity, a = its
        serial (not 0), b zero; tag 2 a creation id: a = the seq of an earlier action by the same player, b = the
        index among the entities it created
      check: entity_ref
      fields:
        - a: u32
        - b: u16
        - tag: EntityRefTag
        - reserved: u8
  - TilePos2:
      doc: "A building centre in doubled tile units (§4.2)"
      fields:
        - x2: i32
        - y2: i32
  - FinePos:
      doc: "A position in 1/256 tile (§4.2)"
      fields:
        - x: i32
        - y: i32
  - InvSlot:
      doc: >-
        A slot of an inventory (C1b decision for I §8.2's transfers: the sim has no notion of an open window, so
        an action names the inventory). owner tag 0 is the acting player's own inventory
      fields:
        - owner: EntityRef
        - inv: InventoryType
        - reserved: u8
        - slot: u16
  - Slot:
      doc: "One slot of the slot heap (§4.5); count 0 means empty, and an empty slot's key is ItemKey none"
      fields:
        - key: ItemKey
        - count: i32
  - SlotView:
      doc: "A slot as the UI sees it (§15.5 INVENTORY): its item, filter and count"
      fields:
        - key: ItemKey
        - filter: ItemKey
        - count: i32
  - ChunkRequest:
      doc: "A worldgen request (§15.9), also WORLDGEN_PENDING's entry (§8.1)"
      fields:
        - surface: SurfaceIndex
        - reserved: u16
        - cx: i32
        - cy: i32
        - commit_tick: Tick
  - Hash256:
      doc: "A SHA-256 digest"
      fields:
        - bytes: "[u8; 32]"
