        - unsupported: 2          # developer: outside the capability manifest (§2.4)
        - player_not_present: 3   # developer: the acting player does not exist or is offline (§15.3 semantic validation)
        - invalid_setting: 4      # developer: a setting value out of its range
        - invalid_index: 5        # developer: a slot, queue or quickbar index out of range
        - target_gone: 16         # "Target gone" (§15.3: a missing serial or creation id)
        - out_of_reach: 17        # "Cannot reach" (I §3.1)
        - inventory_full: 18      # "Inventory full" (I §3.7: mining is refused, 2.0.67)
