# The source of every string in en.yaml (C5-r1 16; 08 §5.1, §12): the text canon a string comes from, or that it is
# a proposal awaiting the text owner. test/ui/locale.test.ts checks every citation against its document. Values:
#   08 §n, 07 §n, I §n, text.yaml  the string is that document's, verbatim (letter case and a final period aside;
#                                  __n__ stands for the document's placeholder or example);
#   factorio n                     Factorio 2.0's own label, for the 08 §5.1 surfaces n that take Factorio's wording: 4 stat
#                                  labels, 5 statuses ("Factorio's vocabulary"), 7 Factorio's own alerts, 23 menus and
#                                  settings, 24 control names and keys ("renamed per §10"), 28 item groups (the data
#                                  carries no group names yet); still to be checked against 2.0's locale by the text owner;
#   format                         placeholders and punctuation only, no words;
#   proposal                       C5's wording, awaiting the text owner (pm/reports/C5.md lists them).
