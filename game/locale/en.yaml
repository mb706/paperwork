# The UI's English strings (10 §7.2; 08 §5.1 surfaces 4–8, 23, 24 and 30; C5).
#
# Display names of items, recipes, entities, resources and technologies come from the data (prototypes.json
# `strings`); everything the interface itself says is here. The keys under fail-reason, flying-text,
# entity-status and alert are prototypes.json's `localeKeys` (C1b decision 13: `<prefix>.<value name, dashed>`).
# Labels are Factorio's where Factorio has one (08 §5.1 #23, #24); statuses, flying texts and refusals follow
# 08 §8, I §3 and the schema's comments. Placeholders are Factorio's positional __1__, __2__ …
#
# Format: nested maps of strings only (src/ui/i18n/yaml.ts parses this subset strictly; PyYAML reads it for the
# font coverage check). Quote a value that holds ": ", starts with a YAML indicator, or reads as a number.
# Rules: sentence case, US spelling, no "!", no ellipsis, no emoji, no "you" (08 §0, §1).

