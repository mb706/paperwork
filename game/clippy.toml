# Determinism bans for every crate (10 §4.1 rule 3, D13, D19). Each entry is verified to fire by
# scripts/check-clippy-bans.ts against test/clippy-bans (part of `npm run check`).
# `std` calls the platform's libm natively but musl's code in WebAssembly, LLVM's powi has unspecified
# rounding, and native code and WebAssembly differ on -0 and NaN in max/min/clamp: use crate `det`.
disallowed-methods = [
  { path = "f64::sin", reason = "not bit-identical across targets: use det::sin (libm)" },
  { path = "f64::cos", reason = "use det::cos (libm)" },
  { path = "f64::tan", reason = "use det (libm)" },
  { path = "f64::asin", reason = "use det (libm)" },
  { path = "f64::acos", reason = "use det (libm)" },
  { path = "f64::atan", reason = "use det (libm)" },
  { path = "f64::atan2", reason = "use det::atan2 (libm)" },
  { path = "f64::exp", reason = "use det (libm)" },
  { path = "f64::exp2", reason = "use det::exp2 (libm)" },
  { path = "f64::exp_m1", reason = "use det (libm)" },
  { path = "f64::ln", reason = "use det (libm)" },
  { path = "f64::ln_1p", reason = "use det (libm)" },
  { path = "f64::log", reason = "use det (libm)" },
  { path = "f64::log2", reason = "use det::log2 (libm)" },
  { path = "f64::log10", reason = "use det (libm)" },
  { path = "f64::powf", reason = "use det::pow (libm)" },
  { path = "f64::powi", reason = "LLVM powi has unspecified rounding: use det::powi" },
  { path = "f64::cbrt", reason = "use det (libm)" },
  { path = "f64::hypot", reason = "use det (libm)" },
  { path = "f64::sinh", reason = "use det (libm)" },
  { path = "f64::cosh", reason = "use det (libm)" },
  { path = "f64::tanh", reason = "use det (libm)" },
  { path = "f64::asinh", reason = "use det (libm)" },
  { path = "f64::acosh", reason = "use det (libm)" },
  { path = "f64::atanh", reason = "use det (libm)" },
  { path = "f64::mul_add", reason = "fused multiply-add differs from a multiply and an add" },
  { path = "f64::max", reason = "native and WebAssembly differ on -0 and NaN: write a comparison or use det::fmax" },
  { path = "f64::min", reason = "native and WebAssembly differ on -0 and NaN: write a comparison or use det::fmin" },
  { path = "f64::clamp", reason = "write comparisons" },
  { path = "f32::sin", reason = "use det (libm)" },
  { path = "f32::cos", reason = "use det (libm)" },
  { path = "f32::tan", reason = "use det (libm)" },
  { path = "f32::asin", reason = "use det (libm)" },
  { path = "f32::acos", reason = "use det (libm)" },
  { path = "f32::atan", reason = "use det (libm)" },
  { path = "f32::atan2", reason = "use det (libm)" },
  { path = "f32::exp", reason = "use det (libm)" },
  { path = "f32::exp2", reason = "use det (libm)" },
  { path = "f32::exp_m1", reason = "use det (libm)" },
  { path = "f32::ln", reason = "use det (libm)" },
  { path = "f32::ln_1p", reason = "use det (libm)" },
  { path = "f32::log", reason = "use det (libm)" },
  { path = "f32::log2", reason = "use det (libm)" },
  { path = "f32::log10", reason = "use det (libm)" },
  { path = "f32::powf", reason = "use det (libm)" },
  { path = "f32::powi", reason = "LLVM powi has unspecified rounding: use det::powi" },
  { path = "f32::cbrt", reason = "use det (libm)" },
  { path = "f32::hypot", reason = "use det (libm)" },
  { path = "f32::sinh", reason = "use det (libm)" },
  { path = "f32::cosh", reason = "use det (libm)" },
  { path = "f32::tanh", reason = "use det (libm)" },
  { path = "f32::asinh", reason = "use det (libm)" },
  { path = "f32::acosh", reason = "use det (libm)" },
  { path = "f32::atanh", reason = "use det (libm)" },
  { path = "f32::mul_add", reason = "fused multiply-add differs from a multiply and an add" },
  { path = "f32::max", reason = "write a comparison" },
  { path = "f32::min", reason = "write a comparison" },
  { path = "f32::clamp", reason = "write comparisons" },
  { path = "libm::fma", reason = "no fused multiply-add" },
  { path = "libm::fmaf", reason = "no fused multiply-add" },
  { path = "std::time::Instant::now", reason = "D13: no wall clock in the simulation" },
  { path = "std::time::SystemTime::now", reason = "D13: no wall clock in the simulation" },
  { path = "std::thread::spawn", reason = "D19: one thread" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "randomly seeded per process: iteration order differs between peers (D3)" },
  { path = "std::collections::HashSet", reason = "randomly seeded per process (D3)" },
]
disallowed-macros = [
  { path = "std::println", reason = "does nothing in WebAssembly: log through the host import (10 §2.5)" },
  { path = "std::print", reason = "does nothing in WebAssembly: log through the host import" },
  { path = "std::eprintln", reason = "does nothing in WebAssembly: log through the host import" },
  { path = "std::eprint", reason = "does nothing in WebAssembly: log through the host import" },
  { path = "std::dbg", reason = "does nothing in WebAssembly" },
]
