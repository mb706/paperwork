# Per-prototype engine overlay (10 §2.4 step 2), keyed by kind and id: the fields the design schema does
# not carry, where the type and `mirrors` defaults are not enough. An entity whose `mirrors` is `new` needs
# an entry here. Items and recipes take group, subgroup and order here (they order the crafting grid,
# I §7.2); `sprite` and `icon` name an art set where it differs from the default `<namespace>/<id>`
# (10 §15.7). Resources and world objects take their map colour here (tiles' are design data, tiles.yaml).
# The engine's character (10 §5.1, §15.2): not a data prototype, so its numbers live here. It is the last
# row of PROTO_ENTITY (type `character`) in builds whose capability manifest includes it, and MOVERS'
# `proto` names that row. Factorio 2.0's character (ISO): 0.15 tiles per tick (I §2.1), reach 10, build 10,
# resource reach 2.7, pickup 1 (I §3.1), 80 inventory slots, hand mining at speed 0.5 (10 §5.1), hand
# crafting at speed 1, 0.4 tiles wide (±0.2, 10 §4.4); its collision mask is 2.0's {player, train, is_object}
# (core/lualib/collision-mask-defaults.lua) on the engine's layers (defaults.yaml).
character:
  running_speed: 0.15
  reach_distance: 10
  build_distance: 10
  resource_reach_distance: 2.7
  item_pickup_distance: 1
  inventory_size: 80
  mining_speed: 0.5
  crafting_speed: 1
  collision_box: [-0.2, -0.2, 0.2, 0.2]
  selection_box: [-0.4, -1.4, 0.4, 0.2]
  collision_mask: [player, train]
  sprite: mover/character
# The data smelters mirror furnaces for their numbers, not their upgrade line: a Keypunch is no stone furnace
# to fast-replace or upgrade into a steel one (proposal, D1: their own fast-replace group).
entities:
  keypunch: {fast_replaceable_group: data-smelter, next_upgrade: null}
  tokenizer: {fast_replaceable_group: data-smelter, next_upgrade: null}
# Item ordering (D1): Factorio 2.0's subgroup and order string for every mirrored item of the slice
# (base/prototypes/item.lua, factorio-data 2.0.77), with this game's id inside the brackets. Items Factorio
# lacks take the letter after their neighbours' (proposals, D1): records after the ores, silicon after the
# plates, the token as transcription's product after smelting's, the Keypunch after the furnaces. Building
# items, tiles' items and fluids not listed keep the defaults' subgroup (defaults.yaml) in file order.
items:
  wood: {subgroup: raw-resource, order: 'a[wood]'}
  coal: {subgroup: raw-resource, order: 'b[coal]'}
  quartz: {subgroup: raw-resource, order: 'd[quartz]'}
