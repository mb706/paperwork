# Map colours (D1). Mirrored resources take Factorio 2.0's map_color (base/prototypes/entity/resources.lua,
# 2.0.77; #rrggbb of round-half-up(255 × channel)); the quartz patch is stone's. New ones are proposals (D1): the
# archive in the Records manila of design/art/DIRECTION.md §3.2 (information reads light, matter dark). Water is
# its tiles. World objects: trees take the chart's tree colour (utility-constants default_color_by_type, 40%
# alpha), rocks the rocks' map_color {129, 105, 78} (decoratives.lua); the campus and the exchange office the
# town-block tile's colour (towns read as one block; their labels name them), the mine entrance the rocks'
# (proposals, D1).
resources:
  iron-ore-patch: {map_color: '#6a8694'}
  copper-ore-patch: {map_color: '#cd6337'}
  coal-patch: {map_color: '#000000'}
  quartz-patch: {map_color: '#b09c6d'}
  uranium-ore-patch: {map_color: '#00b300'}
  archive: {map_color: '#e8cf98'}
  exchange: {map_color: '#c733c4'}
world:
  tree: {map_color: '#30633066'}
  big-rock: {map_color: '#81694e'}
  huge-rock: {map_color: '#81694e'}
  big-sand-rock: {map_color: '#81694e'}
  campus: {map_color: '#7d6a58'}
  exchange-office: {map_color: '#7d6a58'}
  mine-entrance: {map_color: '#81694e'}
