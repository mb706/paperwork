<script type="module">
// B2 audio CPU study (10 §9.4): A4's engine (served from /audio/) with the runtime changes of 10 §9.4 applied as
// variants, played live (bench.mjs measures the audio threads from /proc) or rendered offline (render speed).
//   variant: { fdn, irMax, noXfade, voiceCap, workletVoices, insertsInBank, noInserts, noSynth }; cfg.sfx: { loops, shotsPerSec }
import { MusicEngine } from '/audio/proto/engine/engine.js';
import { PIECES } from '/audio/proto/engine/pieces/index.js';
import { IR_PRESETS, Mixer, dbToGain } from '/audio/proto/engine/mixer.js';
import { Sampler, Synth } from '/audio/proto/engine/instruments.js';

const IR_ORIG = JSON.parse(JSON.stringify(IR_PRESETS));
const SAMPLER_PLAY = Sampler.prototype.play;
const SAMPLER_SEG = Sampler.prototype._segment;
const ADD_REVERB = Mixer.prototype.addReverb;
const ROUTE = MusicEngine.prototype.route;
const SYNTH_PLAY = Synth.prototype.play;
const ECHO = MusicEngine.prototype.echo;
const NOISE = MusicEngine.prototype.noise;
// Joining a piece in the middle (cfg.offset) starts it in the past: clamp automation scheduled before time 0
// (the engine already drops notes due in the past).
for (const m of ['setValueAtTime', 'linearRampToValueAtTime', 'exponentialRampToValueAtTime', 'cancelScheduledValues']) {
  const f = AudioParam.prototype[m];
  AudioParam.prototype[m] = function (...a) { const i = m === 'cancelScheduledValues' ? 0 : 1; if (a[i] < 0) a[i] = 0; return f.apply(this, a); };
}
{
  const f = AudioParam.prototype.setTargetAtTime;
  AudioParam.prototype.setTargetAtTime = function (v, t, c) { return f.call(this, v, Math.max(0, t), c); };
}

function applyVariant(v, insertLog) {
  for (const k of Object.keys(IR_PRESETS)) Object.assign(IR_PRESETS[k], IR_ORIG[k]);
  Sampler.prototype.play = SAMPLER_PLAY;
  Sampler.prototype._segment = SAMPLER_SEG;
  Mixer.prototype.addReverb = ADD_REVERB;
  MusicEngine.prototype.route = ROUTE;
  Synth.prototype.play = SYNTH_PLAY;
  MusicEngine.prototype.echo = ECHO;
  MusicEngine.prototype.noise = NOISE;
  if (v.noSynth) {
    // the bound on moving the synthesised voices (organ, sine, FM), the tape echo and the noise bed into the
    // worklet: they are not played at all (B2 review, finding 4)
    Synth.prototype.play = function () { window.__synthDropped = (window.__synthDropped ?? 0) + 1; };
    const stub = (ctx) => { const g = ctx.createGain(); return { input: g, output: ctx.createGain(), feedback: g.gain, delay: { delayTime: g.gain }, src: { start() {}, stop() {} } }; };
    MusicEngine.prototype.echo = function () { return stub(this.ctx); };
    MusicEngine.prototype.noise = function () { return stub(this.ctx); };
  }
  if (v.irMax) for (const k of Object.keys(IR_PRESETS)) IR_PRESETS[k].seconds = Math.min(IR_PRESETS[k].seconds, v.irMax);
  if (v.noInserts || v.insertsInBank) {
    MusicEngine.prototype.route = function (instName, chOpts = {}) {
      const name = chOpts.channel ?? instName;
      const isSampler = this.inst.get(instName) instanceof Sampler;
      if (v.noInserts || isSampler) {
        if (isSampler && v.insertsInBank) insertLog.set(name, { inserts: chOpts.inserts ?? [], tape: chOpts.tape, tremoloHz: chOpts.tremoloHz, tremoloDepth: chOpts.tremoloDepth });
        return ROUTE.call(this, instName, { ...chOpts, inserts: [] });
      }
      return ROUTE.call(this, instName, chOpts);      // synth channels (organ) keep their native inserts
    };
  }
  if (v.fdn) {
    Mixer.prototype.addReverb = function (name, preset, wetDb = 0) {
      const p = typeof preset === 'string' ? IR_ORIG[preset] : preset;
      const node = new AudioWorkletNode(this.ctx, 'fdn-reverb', {
        numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
        processorOptions: { t60: p.t60[1], t60High: p.t60[2], predelay: p.predelay ?? 0.02, size: 1 },
      });
      const wet = this.ctx.createGain();
      wet.gain.value = dbToGain(wetDb) * 0.7;
      node.connect(wet);
      wet.connect(this.musicBus);
      this.reverbs.set(name, { input: node, wet });
      return node;
    };
  }
  if (v.noXfade) {
    Sampler.prototype.play = function (t, midi, vel, dur, opts = {}) {
      if (this.layers.length > 1 && opts.layer == null && (dur < 0.5 || this.def.kind === 'oneshot')) {
        const L = this.layers.length;
        const layer = Math.min(L - 1, Math.round(Math.max(0, Math.min(1, vel)) ** 0.9 * (L - 1)));
        return SAMPLER_PLAY.call(this, t, midi, vel, dur, { ...opts, layer });
      }
      return SAMPLER_PLAY.call(this, t, midi, vel, dur, opts);
    };
  }
}

const NF = 14;
// The bank: one AudioWorklet node, one stereo output per sampler instance plus one for the SFX.
async function useBank(ctx, eng, v, insertLog, sfxOut) {
  const samplers = [...eng.inst.entries()].filter(([, s]) => s instanceof Sampler);
  const nOut = samplers.length + 1;
  const node = new AudioWorkletNode(ctx, 'sampler-bank', { numberOfInputs: 0, numberOfOutputs: nOut,
    outputChannelCount: Array(nOut).fill(2), processorOptions: { maxVoices: (v.voiceCap ?? 48) + 24 } });
  const ids = new Map();
  let next = 0;
  const sendBuf = (ab) => {
    if (ids.has(ab)) return ids.get(ab);
    const id = next++;
    ids.set(ab, id);
    const chans = [];
    for (let c = 0; c < ab.numberOfChannels; c++) {
      const d = ab.getChannelData(c);
      const i16 = new Int16Array(d.length);
      for (let i = 0; i < d.length; i++) i16[i] = Math.max(-32768, Math.min(32767, Math.round(d[i] * 32767)));
      chans.push(i16);
    }
    node.port.postMessage({ t: 'buf', id, chans, rate: ab.sampleRate }, chans.map((c) => c.buffer));
    return id;
  };
  const pending = [];
  samplers.forEach(([name, smp], k) => {
    node.connect(smp.out, k);
    smp.__bank = { out: k };
    for (const ab of smp.buffers.values()) sendBuf(ab);
    const chName = [...eng.channels.entries()].find(([, ch]) => ch.input === smp.out)?.[0];
    const ins = insertLog.get(chName);
    if (ins) {
      for (const kind of ins.inserts) {
        if (kind === 'tape') node.port.postMessage({ t: 'insert', out: k, kind: 'tape', p: ins.tape ?? {} });
        if (kind === 'tremolo') node.port.postMessage({ t: 'insert', out: k, kind: 'tremolo', p: { rate: ins.tremoloHz ?? 5.2, depth: ins.tremoloDepth ?? 0.3 } });
      }
    }
  });
  node.connect(sfxOut, nOut - 1);
  Sampler.prototype._segment = function (t, buf, rate, gain, attack, hold, release, offset, linearAttack) {
    const off = t + Math.max(hold, attack + 0.01);
    pending.push([t, ids.get(buf), this.__bank.out, rate, gain, attack, linearAttack ? 1 : 0, off, release, off + release * 1.3, offset, 0, 0, 0]);
  };
  const flush = () => {
    if (!pending.length) return;
    const data = new Float64Array(pending.length * NF);
    pending.forEach((r, i) => data.set(r, i * NF));
    node.port.postMessage({ t: 'notes', n: pending.length, data }, [data.buffer]);
    pending.length = 0;
  };
  return { node, sendBuf, push: (r) => pending.push(r), flush, sfxOut: nOut - 1 };
}

// A busy factory's SFX: working loops and one-shots through the bank (or native voices without the bank).
async function loadSfx(ctx) {
  const names = ['keypunch_loop', 'belt_loop', 'ui_click_1', 'ui_click_2', 'build_small_1', 'build_medium_1', 'mine_ore_1',
    'mine_ore_2', 'inserter_swing_1', 'inserter_swing_2', 'footstep_grass_1', 'footstep_grass_2', 'deconstruct_1'];
  const out = {};
  await Promise.all(names.map(async (n) => { out[n] = await ctx.decodeAudioData(await (await fetch(`/audio/demos/sfx/${n}.ogg`)).arrayBuffer()); }));
  return out;
}

async function build(ctx, cfg) {
  await ctx.audioWorklet.addModule('/study/fdn-worklet.js');
  await ctx.audioWorklet.addModule('/study/bank-worklet.js');
  const v = cfg.variant ?? {};
  const insertLog = new Map();
  applyVariant(v, insertLog);
  const pack = `/audio/out/samples/${cfg.pack ?? 'prep'}`;
  const manifest = await (await fetch(`${pack}/instruments.json`)).json();
  const eng = new MusicEngine(ctx, { manifest, baseUrl: pack, mixer: cfg.mixer ?? {} });
  const spec = PIECES[cfg.piece];
  await eng.loadSamplers(spec.samplers);
  spec.setup(eng, cfg.params ?? {});
  const sfxBus = ctx.createGain();
  sfxBus.gain.value = 0.5;
  sfxBus.connect(eng.mixer.master);
  let bank = null;
  if (v.workletVoices) bank = await useBank(ctx, eng, v, insertLog, sfxBus);
  // decoded memory, counting each AudioBuffer once (aliases share buffers)
  const seen = new Set();
  let decoded = 0;
  for (const inst of eng.inst.values()) if (inst.buffers) for (const b of inst.buffers.values()) {
    if (!seen.has(b)) { seen.add(b); decoded += b.length * b.numberOfChannels * 4; }
  }
  const sfx = cfg.sfx ? await loadSfx(ctx) : null;
  const sfxIds = {};
  if (sfx && bank) for (const [n, ab] of Object.entries(sfx)) sfxIds[n] = bank.sendBuf(ab);
  return { eng, spec, bank, sfx, sfxIds, sfxBus, decodedMB: decoded / 2 ** 20 };
}

function startPiece(ctx, b, cfg, t0) {
  const { eng, spec, bank, sfx, sfxIds, sfxBus } = b;
  const auto = (cfg.automation ?? []).slice().sort((a, c) => a[0] - c[0]);
  eng.clock.listeners.add((now) => { while (auto.length && auto[0][0] <= now - t0 + (cfg.offset ?? 0)) Object.assign(eng.state, auto.shift()[1]); });
  const piece = new spec.Piece(eng, { ...(cfg.params ?? {}), duration: cfg.duration, start: t0 + 0.1 - (cfg.offset ?? 0) });
  eng.clock.add(piece);
  // SFX schedule, driven by the same clock (works offline too)
  if (sfx) {
    const oneShots = Object.keys(sfx).filter((n) => !n.endsWith('_loop'));
    let k = 0, nextShot = t0 + 0.2, loopsStarted = false;
    const rnd = () => { k = (k * 1103515245 + 12345) & 0x7fffffff; return k / 0x7fffffff; };
    eng.clock.listeners.add((now) => {
      const horizon = now + eng.clock.lookahead;
      if (!loopsStarted) {
        loopsStarted = true;
        for (let i = 0; i < cfg.sfx.loops; i++) {
          const n = i % 2 ? 'belt_loop' : 'keypunch_loop';
          const ab = sfx[n];
          const len = ab.length;
          if (bank) bank.push([now + 0.05, sfxIds[n], bank.sfxOut, 1, 0.25, 0.3, 1, now + 1e6, 0.3, now + 1e6, (i * 0.37) % (ab.duration - 0.1), (i / cfg.sfx.loops) * 1.4 - 0.7, 0, len - 1]);
          else { const s = ctx.createBufferSource(); s.buffer = ab; s.loop = true; const g = ctx.createGain(); g.gain.value = 0.25; const p = ctx.createStereoPanner(); p.pan.value = (i / cfg.sfx.loops) * 1.4 - 0.7; s.connect(g); g.connect(p); p.connect(sfxBus); s.start(now + 0.05, (i * 0.37) % (ab.duration - 0.1)); }
        }
      }
      while (nextShot < horizon) {
        const n = oneShots[Math.floor(rnd() * oneShots.length)];
        const ab = sfx[n];
        const rate = 1 + (rnd() - 0.5) * 0.06;
        const pan = rnd() * 1.4 - 0.7;
        if (bank) bank.push([nextShot, sfxIds[n], bank.sfxOut, rate, 0.4, 0, 0, nextShot + ab.duration, 0.05, nextShot + ab.duration + 0.1, 0, pan, 0, 0]);
        else { const s = ctx.createBufferSource(); s.buffer = ab; s.playbackRate.value = rate; const g = ctx.createGain(); g.gain.value = 0.4; const p = ctx.createStereoPanner(); p.pan.value = pan; s.connect(g); g.connect(p); p.connect(sfxBus); s.start(nextShot); s.onended = () => { s.disconnect(); g.disconnect(); p.disconnect(); }; }
        nextShot += 1 / cfg.sfx.shotsPerSec;
      }
    });
  }
  if (bank) {
    const orig = eng.clock.tick.bind(eng.clock);
    eng.clock.tick = (now) => { orig(now); bank.flush(); };
  }
  return piece;
}

window.play = async (cfg) => {
  const ctx = new AudioContext({ latencyHint: cfg.latencyHint ?? 'playback', sampleRate: cfg.sampleRate ?? undefined });
  await ctx.resume();
  const b = await build(ctx, cfg);
  const t0 = ctx.currentTime;
  startPiece(ctx, b, cfg, t0);
  const eng = b.eng;
  let tickMs = 0, maxTick = 0, vMax = 0, vSum = 0, vN = 0;
  const orig = eng.clock.tick.bind(eng.clock);
  eng.clock.tick = (now) => {
    const a = performance.now(); orig(now); const d = performance.now() - a; tickMs += d; maxTick = Math.max(maxTick, d);
    let act = 0; for (const inst of eng.inst.values()) if (inst instanceof Sampler) act += inst.active;
    vMax = Math.max(vMax, act); vSum += act; vN++;
  };
  eng.clock.cursor = t0;
  eng.clock.start();
  let bankStats = null;
  if (b.bank) b.bank.node.port.onmessage = (e) => { bankStats = e.data; };
  window.__bench = () => { if (b.bank) b.bank.node.port.postMessage({ t: 'stats' });
    return { tickMs, maxTick, notes: eng.log.length, dropped: eng.dropped ?? 0, decodedMB: b.decodedMB, sr: ctx.sampleRate,
      voicesMax: b.bank ? (bankStats?.maxActive ?? 0) : vMax, voicesMean: vN ? vSum / vN : 0, stolen: bankStats?.stolen ?? 0 }; };
  return { decodedMB: b.decodedMB, sampleRate: ctx.sampleRate };
};

// Offline render speed: the same graph in an OfflineAudioContext, rendered as fast as possible. On one thread,
// seconds of wall time per second of audio approximate the realtime audio thread's load; bench.html can measure
// this in any browser, where /proc is not available.
window.offline = async (cfg) => {
  const sr = cfg.sampleRate ?? 48000;
  const secs = cfg.seconds ?? 30;
  const ctx = new OfflineAudioContext(2, Math.ceil(sr * (secs + 1)), sr);
  const b = await build(ctx, cfg);
  startPiece(ctx, b, cfg, 0);
  const t = performance.now();
  await b.eng.clock.renderOffline(secs + 1, 0.25);
  const ms = performance.now() - t;
  return { load: ms / 1000 / (secs + 1), ms, seconds: secs + 1, errors: b.eng.clock.errors };
};

// microbenchmark: N concurrent sample voices, native nodes against one worklet mixer
window.voices = async (cfg) => {
  const ctx = new AudioContext({ latencyHint: 'playback' });
  await ctx.resume();
  const sr = ctx.sampleRate;
  const len = Math.floor(sr * 3);
  const ab = ctx.createBuffer(cfg.channels ?? 1, len, sr);
  for (let c = 0; c < ab.numberOfChannels; c++) {
    const d = ab.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = Math.sin(i * 0.031 + c) * Math.exp(-i / sr) * 0.5;
  }
  const out = ctx.createGain();
  out.gain.value = 0.05;
  out.connect(ctx.destination);
  const dur = 2.0;
  const perSec = cfg.voices / dur;
  let next = ctx.currentTime + 0.2;
  let worklet = null;
  if (cfg.mode === 'worklet') {
    await ctx.audioWorklet.addModule('/study/sampler-worklet.js');
    worklet = new AudioWorkletNode(ctx, 'sampler', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { maxVoices: Math.max(64, cfg.voices + 8) } });
    worklet.connect(out);
    const i16 = new Int16Array(len);
    const d = ab.getChannelData(0);
    for (let i = 0; i < len; i++) i16[i] = Math.round(d[i] * 32767);
    worklet.port.postMessage({ t: 'buf', id: 0, data: i16, rate: sr });
  }
  let k = 0;
  setInterval(() => {
    const horizon = ctx.currentTime + 0.5;
    const batch = [];
    while (next < horizon) {
      const rate = 2 ** (((k * 7) % 13 - 6) / 12);
      const pan = ((k * 37) % 21 - 10) / 10;
      if (cfg.mode === 'native') {
        const src = ctx.createBufferSource();
        src.buffer = ab;
        src.playbackRate.value = rate;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, next);
        g.gain.linearRampToValueAtTime(0.3, next + 0.004);
        g.gain.setTargetAtTime(0, next + dur - 0.3, 0.3 / 4.5);
        let node = g;
        if (cfg.pan) { const p = ctx.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
        src.connect(g);
        node.connect(out);
        src.start(next);
        src.stop(next + dur + 0.1);
        src.onended = () => { src.disconnect(); g.disconnect(); if (node !== g) node.disconnect(); };
      } else {
        batch.push({ when: next, buf: 0, rate, gain: 0.3, pan, dur: dur - 0.3, release: 0.3 });
      }
      next += 1 / perSec;
      k++;
    }
    if (batch.length) worklet.port.postMessage({ t: 'notes', notes: batch });
  }, 100);
  window.__bench = () => ({ tickMs: 0, maxTick: 0, notes: k, dropped: 0 });
  return { sampleRate: sr };
};
window.ready = true;
</script>
