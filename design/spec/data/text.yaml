# Engine-readable text (R4-ui; DECISIONS, round-4 ownership additions).
#
# The rules, budgets and reasons behind these strings are in spec/08-text.md; the strings live
# here, once. The data stage loads this file with the others and checks it (SCHEMA.md, text.yaml).
#
# Conventions
# - Strings follow 08: sentence case, US spelling, no "!", no ellipsis, no emoji. *Asterisks* mark
#   italics (titles of works, and a word used as a word); the UI renders them, nothing else.
# - Numbers that the data also holds are placeholders (08 P17), resolved by the build:
#     {heat.tree_damage_c}                 a meta.yaml path
#     {entity.<id>.<field>}                an object's field; also item., recipe., tile., technology.;
#                                          `extra.` fields included, e.g. {entity.steam-engine.extra.max_kw}
#     {a / b}                              the ratio of two such paths, printed as an integer when exact,
#                                          otherwise to one decimal
#   A number written in words ("twice", "a third") is allowed only with an `asserts` entry that the
#   build evaluates against the data: a comparison (==, <, >) of numbers and paths in the placeholder
#   syntax. A recipe's ingredient or product is addressed by its id (recipe.x.products.prose is its
#   amount); `cost_ratio` is a multi-level technology's cost ratio between its first two levels.
#   Achievements may carry `asserts` as well. An achievement's text may restate its own condition's
#   numbers as digits ("Craft 1,000 Memos by hand."): that is P17's one exemption (DECISIONS §41), and
#   the validator checks that every such number is one of its condition's values.
# - `requires` names conditions that must all hold for the string to apply (SCHEMA.md, text.yaml):
#     map settings: heat, staffing, runaways (Runaways is not Off), hollow-work, race, scooped;
#     systems that no setting turns off, met when the build contains them: exchanges, quality, agents.
# - Ids in conditions and targets must exist in the data; the validator checks them.

# ---------------------------------------------------------------- loading tips (08 §7)
# One or two true sentences; the second, when present, ties the fact to a mechanic.
tips:
  - id: eniac-power
    text: "ENIAC held nearly 18,000 vacuum tubes and drew about 150 kW. One steam engine produces {entity.steam-engine.extra.max_kw} kW."
    requires: []
  - id: computer-profession
    text: "*Computer* was a profession. The first six ENIAC programmers were hired from it."
    requires: []
  - id: every-joule
    text: "Every joule a machine uses ends up as heat in its chunk. Water sheds heat {tile.water.kappa_per_s / tile.grass.kappa_per_s} times as fast as grass."
    requires: [heat]
  - id: power-station
    text: "A thermal power station turns about a third of its fuel into electricity. Steam engines and turbines release the rest as heat in their chunk."
    requires: [heat]
    asserts: ["entity.boiler.energy.kw == 3 * entity.boiler.extra.steam_per_s * 30"]   # "a third": 5.4 MW of fuel for 1.8 MW of steam at 30 kJ per unit (DECISIONS §18)
  - id: north
    text: "Ambient temperature falls toward the north. A machine there runs further below its thermal limit."
    requires: [heat]
  - id: trees
    text: "Above {heat.tree_damage_c} °C, trees lose their leaves and absorb less heat."
    requires: [heat]
  - id: landauer
    text: "Erasing one bit releases at least kT ln 2 of heat (Landauer, 1961). The bound is lower where it is cold."
    requires: [heat]
  - id: staffing-range
    text: "A university staffs every Seminar within {staffing.radius} tiles of its campus, a range that *Packet switching* and *Web search* extend. Holding a Seminar shows the range."
    requires: [staffing]
  - id: staffing-demand
    text: "A Seminar's staff demand follows the speed its modules and Switches add. Research-speed technologies and productivity add none."
    requires: [staffing]
  - id: field-advances
    text: "The field advances on its own. Each year by which your newest published research passes 1945 adds {meta.world.beta} field-years to it."
    requires: []
  - id: romer
    text: "Papers are consumed. Technologies are not (Romer, 1990)."
    requires: []
  - id: bloom
    text: "Each level of Research productivity costs twice the last. Holding growth constant has taken ever more researchers (Bloom, Jones, Van Reenen & Webb, 2020)."
    requires: []
    asserts: ["technology.research-productivity.cost_ratio == 2"]   # "twice the last"
  - id: muennighoff
    text: "Up to four passes over the same data are nearly as good as new data; beyond that, returns fall (Muennighoff et al., 2023)."
    requires: [exchanges]
  - id: lee-dedup
    text: "Deduplicated training data gives better models in fewer steps (Lee et al., 2021). Deduplication keeps less than half of the crawl it reads."
    requires: [exchanges]
    asserts: ["recipe.deduplication.products.prose < 0.5 * recipe.deduplication.ingredients.crawl"]   # "less than half"
  - id: exchange-backlog
    text: "An exchange's first crawl takes the backlog. After that it yields the town's new writing."
    requires: [exchanges]
  - id: shumailov
    text: "Models trained on generated text lose the tails of the distribution (Shumailov et al., 2023). Archives were written before any of it."
    requires: [exchanges]
  - id: kaplan
    text: "Loss falls as a power law in compute, data and parameters (Kaplan et al., 2020). A frontier cluster shows its progress as loss."
    requires: []
  - id: binning
    text: "Dies cut from the same wafer are sold at different speeds. Quality is binning."
    requires: [quality]
  - id: holdout
    text: "A held-out set used to choose between models is no longer held out. A Monitor uses up an evaluation set with every clean."
    requires: [runaways]
  - id: agents-blueprints
    text: "Construction agents build blueprints. A blueprint may contain an agent hub."
    requires: [agents]

# ---------------------------------------------------------------- tips and tricks (08 §5.3)
# Functional entries that may address the player (H §3). The first four ship with the slice (a text
# and a still image); the rest unlock with a technology, as Factorio's do.
tips_and_tricks:
  - id: heat
    title: Heat
    requires: [heat]
    unlocked_by: null
    text: >-
      Every machine turns the energy it uses into heat in the chunk where it stands. Power plants
      release their conversion losses at the steam engines and turbines: twice the electricity
      they make. Heat spreads to neighboring chunks and is lost to the surroundings: fastest over
      water, then snow, grass, rock and sand, slowest over concrete. Forests help; above
      {heat.tree_damage_c} °C trees lose their leaves. Turn on Heat in the map to see chunk
      temperatures; in alt-mode the minimap shows them too. Computing machines slow down above
      their thermal limit, and their power use does not fall.
  - id: staff
    title: Staff
    requires: [staffing]
    unlocked_by: null
    text: >-
      Seminars need staff. A university supplies staff to every Seminar within {staffing.radius}
      tiles of its campus (more after *Packet switching* and *Web search*), and its supply grows with
      the field. A working Seminar needs one staff,
      more if modules or Switches make it faster; research-speed technologies cost no staff.
      Seminars in range of the same universities share their staff the way machines share a power
      network: when demand exceeds supply, they all slow down by the same factor. Hold a Seminar to
      see each campus's range. A Seminar outside every range shows No staff and does not research.
  - id: records-and-tokens
    title: Records and tokens
    requires: []
    unlocked_by: null
    text: >-
      Memos need tokens, and tokens are transcribed from records. Records come from archives:
      library stacks at the edges of towns and, farther out, records stores in old mines. Mine an
      archive like ore, then transcribe the records in a Keypunch, which burns fuel like a furnace.
      Archives are finite.
  - id: the-field
    title: The field
    requires: []
    unlocked_by: null
    text: >-
      The field is the rest of the world's research, given as a year. It advances on its own, and
      it advances when your literature does. Towns and their universities grow with it. The
      technology screen shows your literature, the field and the difference between them.
  - id: terminals
    title: Terminals
    requires: [staffing]
    unlocked_by: time-sharing
    text: >-
      A Terminal inside a campus's range joins that university to every other Terminal on the same
      data line. Seminars staffed through one Terminal draw on every university the line connects.
      A data line is a link for the machines on it (Containment).
  - id: containment
    title: Containment
    requires: [runaways]
    unlocked_by: deep-learning
    text: >-
      Every deployment leaks a little. When the Leak reaches 1, the deploying building with the
      largest share is compromised: it stops working and copies itself to the machines it is linked
      to. Thirty seconds without power cleans a compromised machine; a power switch whose condition
      reads its Compromised signal does this by itself. A Monitor cleans machines in its range, one
      evaluation set each.
    asserts: ["runaways.clean.power_off_s == 30"]
  - id: closing-the-loop
    title: Closing the loop
    requires: []
    unlocked_by: automated-research
    text: >-
      The first System card written by a Research hall closes the loop. *Model generation* and every
      other technology paid in System cards alone wait for it. Accelerators that exist at that moment
      are the overhang; the run report counts them.

