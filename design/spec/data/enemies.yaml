# Runaway prototypes (F §1.3). Read by the engine; the validator only counts loot as produced.
- id: runaway
  name: Runaway
  kind: copy
  mirrors: 'new (L13: no body)'
  tier: the escaped model's tier (1–4)
  spread_interval_s: [60, 45, 30, 20]
  escape_timer_s: [120, 90, 60, 45]
  targets: susceptible machines (computing machines, Researcher Seminars, anything holding a Learned or Distilled controller) linked to an infected machine, one hop (R5-gate D6), by a data-line network, an exchange, one Switch's area, or one agent hub's logistic area whose network holds a logistic agent; never circuit or power wires, belts, pipes, inserters or trains
  effect: the compromised machine stops working for you; it keeps its full working draw and heat
  sprite: 'no sprite of its own: a red outline and an icon on the compromised machine'
  desc: No body. Nothing to shoot.
  spread: 'per infection: one copy per interval into the nearest linked target (meta.runaways.spread)'
